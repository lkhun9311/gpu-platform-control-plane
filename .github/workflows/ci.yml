name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: gpu-platform-operator

jobs:
  infra-validate:
    name: Infra validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Validate infra, manifests, and workflows
        run: make infra-validate

  build-push:
    name: Build and push operator image
    runs-on: ubuntu-latest
    # Push only from the default branch; PRs (including forks) run tests only.
    #
    # The provisioning gate skips this job cleanly until AWS exists.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TF_STATE_BUCKET != ''
    needs: infra-validate
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.CI_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build and push the operator image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMG="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          make docker-build IMG="$IMG"
          make docker-push IMG="$IMG"
          # Capture the pushed image's digest reference so the next step can pin it exactly.
          DIGEST_REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMG")
          echo "digest_ref=$DIGEST_REF" >> "$GITHUB_OUTPUT"

      - name: Open an operator image digest-bump PR
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST_REF: ${{ steps.build.outputs.digest_ref }}
        run: |
          set -euo pipefail
          # Pin the operator image to the digest just pushed, so Argo CD deploys exactly this build.
          #
          # The bump lands via a PR rather than a direct push, keeping Git the source of truth.
          make kustomize
          ( cd config/manager && "$GITHUB_WORKSPACE/bin/kustomize" edit set image "controller=${DIGEST_REF}" )
          BRANCH="bot/operator-digest-${GITHUB_SHA:0:12}"
          git config user.name "gpu-platform-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add config/manager/kustomization.yaml
          git commit -m "chore: pin operator image to digest ${GITHUB_SHA:0:12}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: bump operator image digest" \
            --body "Automated digest pin from commit ${GITHUB_SHA}. Argo CD will deploy this exact build once merged."
