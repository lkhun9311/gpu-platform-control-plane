name: CI

on:
  push:
  pull_request:

permissions: {}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: gpu-platform-operator

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: |
          go mod tidy
          make test

  build-push:
    name: Build and push operator image
    runs-on: ubuntu-latest
    # Push only from the default branch; PRs (including forks) run tests only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.CI_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build and push the operator image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMG="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          make docker-build IMG="$IMG"
          make docker-push IMG="$IMG"
