name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  gitleaks:
    permissions:
      contents: read
    name: gitleaks over the whole history
    runs-on: ubuntu-latest
    steps:
      # The whole history, not the diff: a key removed in a later commit is still published.
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # The container by digest rather than the action: a tag can be moved, a digest cannot.
      # It exits 1 on any finding .gitleaks.toml does not allow, and the run takes about two seconds.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose
