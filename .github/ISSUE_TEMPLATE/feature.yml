name: Feature
description: New behaviour or an improvement
labels: ["kind/feature"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: What problem this solves and for whom.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: Small steps as checkboxes, one commit or PR each.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Observable conditions, each checked by a test, a command or a measurement.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [admission, gateway, serving, scheduling, observability, mlops, harness, gpu-runner, infra, ci, upstream]
    validations:
      required: true
