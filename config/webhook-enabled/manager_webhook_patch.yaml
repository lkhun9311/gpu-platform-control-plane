apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
        - name: manager
          args:
            - --webhook-cert-path=/tmp/k8s-webhook-server/serving-certs
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
      volumes:
        - name: webhook-certs
          secret:
            secretName: gpu-platform-control-plane-webhook-server-cert
