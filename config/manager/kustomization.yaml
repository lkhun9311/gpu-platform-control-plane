resources:
- manager.yaml

# The digest lives here, not in the Deployment, because two consumers read these manifests and only one of
# them can pull from ECR.
#
# `make deploy` runs `kustomize edit set image controller=${IMG}`, which rewrites this transform -- so the kind
# path builds locally, side-loads, and overrides the pin, while Argo CD builds the same directory unchanged
# and gets the published digest. Putting the ECR reference in the Deployment removed the name the transform
# matches on, so the override silently stopped applying and every e2e run failed on a Pod that could not
# pull from a registry kind has no credentials for.
#
# ci.yml is written to update exactly this field in both kustomizations in one commit, so the operator and
# the gateway can never be pinned from different builds.
images:
- digest: sha256:0311e04a0f39cdd4c1d4b113c5506fcd262db88c1c2eb7c08bc5ec4ad1a1e0fe
  name: controller
  newName: 007635145730.dkr.ecr.ap-northeast-2.amazonaws.com/gpu-platform-operator
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
