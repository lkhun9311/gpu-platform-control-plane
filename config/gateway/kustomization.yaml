# The bundle of gateway manifests.
#
# config/default no longer composes this directory, so nothing else rewrites the placeholder namespace.
# Every manifest here hardcodes namespace: system as a kubebuilder scaffold placeholder.
# This transform rewrites that placeholder to the real namespace for a standalone build.
namespace: gpu-platform-control-plane-system

resources:
- serviceaccount.yaml
- rbac.yaml
- deployment.yaml
- service.yaml

# The digest lives here, not in the Deployment, because two consumers read these manifests and only one of
# them can pull from ECR.
#
# `make deploy` runs `kustomize edit set image gateway=${IMG}`, which rewrites this transform -- so the kind
# path builds locally, side-loads, and overrides the pin, while Argo CD builds the same directory unchanged
# and gets the published digest. Putting the ECR reference in the Deployment removed the name the transform
# matches on, so the override silently stopped applying and every e2e run failed on a Pod that could not
# pull from a registry kind has no credentials for.
#
# ci.yml is written to update exactly this field in both kustomizations in one commit, so the operator and
# the gateway can never be pinned from different builds.
images:
- digest: sha256:98cb9c4dee7b0a5c7a38e8bea8004431fd81c7fc6eb292440d737859955c8eb9
  name: gateway
  newName: 007635145730.dkr.ecr.ap-northeast-2.amazonaws.com/gpu-platform-gateway
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
