# Hand-written rather than generated by controller-gen.
#
# This repository's conventions forbid running `make manifests` casually, because the same target regenerates
# api/ and config/crd/ and in the Korean mirror repository that destroys hand-translated annotations. The
# marker on MLTrainingJobValidator still records the intended shape, so a future `make manifests` should
# produce this file rather than disagree with it.
# Names and namespace are written out in full rather than left to kustomize.
#
# config/default sets namePrefix and namespace, but those apply only to ITS OWN resources. This file is
# pulled in as a SIBLING of ../default by config/webhook-enabled, so a transformer there would not reach it,
# and adding one at the parent level would prefix ../default a second time. The first version of this overlay
# built cleanly with a webhook pointing at a Service named "webhook-service" in a namespace called "system" —
# neither of which exists. Spelling the final names out is what makes that unrepresentable.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: gpu-platform-control-plane-validating-webhook-configuration
webhooks:
  - name: vmltrainingjob.kb.io
    admissionReviewVersions:
      - v1
    # No side effects: the validator only reads, so the apiserver may run it during a dry-run request.
    sideEffects: None
    # Fail, deliberately. This rule exists to stop writes that would otherwise be accepted and silently
    # ignored, so a rule that vanished whenever the webhook pod was unreachable would go missing exactly when
    # the cluster is least healthy. Refusing writes is the safer direction here because no controller of ours
    # writes MLTrainingJobs — only humans and CI do, and both can retry.
    failurePolicy: Fail
    clientConfig:
      service:
        name: gpu-platform-control-plane-webhook-service
        namespace: gpu-platform-control-plane-system
        path: /validate-platform-lkhun9311-github-io-v1-mltrainingjob
    rules:
      - apiGroups:
          - platform.lkhun9311.github.io
        apiVersions:
          - v1
        # DELETE is absent on purpose: teardown belongs to the finalizer, and a webhook able to refuse a
        # delete could strand an object nobody can remove.
        operations:
          - CREATE
          - UPDATE
        resources:
          - mltrainingjobs
  - name: vgpupod.kb.io
    admissionReviewVersions:
      - v1
    sideEffects: None
    # Fail, and this one is the reason the whole file exists. The rule stops a Pod taking a device that
    # nothing would charge; a rule that vanished whenever the webhook Pod was unreachable would open the
    # bypass at exactly the moment nobody is watching the cluster.
    #
    # The cost is real and worth stating: while the webhook is down, no GPU Pod can be created in a selected
    # namespace at all. That is the correct direction for a quota boundary — refusing work is recoverable,
    # unaccounted GPU consumption is not — but it means this webhook's availability is now part of the
    # platform's availability.
    failurePolicy: Fail
    clientConfig:
      service:
        name: gpu-platform-control-plane-webhook-service
        namespace: gpu-platform-control-plane-system
        path: /validate--v1-pod
    # Scoped by LABEL rather than applied cluster-wide, and the scope is not a convenience.
    #
    # Every Pod in the cluster would otherwise pass through this webhook, including the ones in kube-system
    # that have to start before it does — a Pod webhook that can refuse kube-system is how a cluster becomes
    # unbootable. The label goes on namespaces the platform governs, which is also the only place the quota
    # claim is made.
    namespaceSelector:
      matchLabels:
        platform.lkhun9311.github.io/gpu-quota-enforced: "true"
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        # CREATE only. A Pod's resource requests are immutable, so no UPDATE can introduce a device request
        # that CREATE did not already see, and refusing a DELETE could strand a Pod nobody can remove.
        operations:
          - CREATE
        resources:
          - pods
