# The slim observability profile is disabled until the operator exposes custom metrics.
#
# It has no automated sync policy, so it is one manual sync from active.
#
# Prune=false and Replace=false, so nothing here is deleted or force-applied by a sync.
#
# This comment said "chart CRDs", and docs/09 repeated it as a Helm chart with `skipCrds` pinned. There is
# no chart: the source below is a Git path holding a PodMonitor, a ServiceMonitor, alert rules and a
# dashboard JSON. No CRD ships from here at all, so the guarantee is about those objects, not about
# cluster-scoped CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-platform-observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/lkhun9311/gpu-platform-control-plane.git
    targetRevision: main
    path: config/prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-platform-control-plane-system
  syncPolicy:
    syncOptions:
      - Prune=false
      - Replace=false
      - CreateNamespace=true
