# The storage class the resume arms name.
#
# sync-wave 0: it must exist before any workload that claims it, and nothing it depends on is in this repo --
# the EBS CSI driver is an EKS addon that Terraform owns, not an Argo application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-platform-storage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/lkhun9311/gpu-platform-control-plane.git
    targetRevision: main
    path: config/storage
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
