# Alerts for the gateway, and each one exists because a specific silent failure was found rather than
# imagined. Collecting metrics nobody looks at is the state this file's companion PodMonitor just left behind.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gateway-rules
  namespace: system
  labels:
    app.kubernetes.io/name: gpu-platform-control-plane
    app.kubernetes.io/component: gateway
    app.kubernetes.io/managed-by: kustomize
spec:
  groups:
    - name: gateway.admission
      rules:
        # The KV-aware guard fails OPEN: when a backend's telemetry goes stale it admits unconditionally
        # rather than guessing. That is the right choice — refusing traffic on the strength of a number nobody
        # could read would be worse — but it means the arm can be fully bypassed while every request still
        # succeeds and no error is recorded anywhere. Staleness is therefore not a warning about the future;
        # it is the statement that admission control is currently OFF for that backend.
        #
        # PRECONDITION: this fires only when the gateway runs with --admission-mode=kv-aware. In any other
        # mode the guard does not exist, backend_telemetry_fresh is never observed, and a Vec with no
        # observed child emits no series at all — so "== 0" matches nothing and the rule is permanently
        # inactive. That is correct here (there is no guard to bypass), and it is why the rule below exists:
        # absence means "no guard" and "guard broken" equally, and only one of those is an incident.
        - alert: GatewayAdmissionGuardBypassed
          expr: gpuaas_gateway_backend_telemetry_fresh == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "KV guard is admitting unconditionally for {{ $labels.backend }}"
            description: >-
              Its telemetry has been stale for two minutes, so the guard fails open and every request is
              admitted regardless of KV-cache pressure. Requests keep succeeding, so nothing else will say so.

        # Scrape failures are the usual cause of the alert above, and separating them says whether the backend
        # is unreachable or merely slow to answer.
        # Same precondition as above: no kv-aware mode, no scrape, no series.
        - alert: GatewayBackendScrapeFailing
          expr: rate(gpuaas_gateway_backend_scrape_errors_total[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Cannot read telemetry from {{ $labels.backend }}"

        # The two rules above are written over series the guard itself publishes, so they are silent when the
        # guard is off AND when the guard is on but publishing nothing: a scraper goroutine that never
        # started, a backend list that came back empty, a panic in the scrape loop. Both look identical to
        # Prometheus, and the second is precisely the failure GatewayAdmissionGuardBypassed was written for.
        #
        # admission_mode_active is set once at process start, before any request or scrape, so it is present
        # even when nothing else about the guard is. "unless on()" drops this series the moment any
        # telemetry_fresh series exists at all, so the rule speaks only about total silence, not staleness.
        - alert: GatewayKVGuardNotReporting
          expr: |
            (gpuaas_gateway_admission_mode_active{mode="kv-aware"} == 1) unless on() gpuaas_gateway_backend_telemetry_fresh
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "kv-aware admission is configured but publishing no backend telemetry"
            description: >-
              The gateway resolved --admission-mode=kv-aware, so admission decisions are supposed to depend
              on backend KV-cache pressure, but no backend has reported freshness for five minutes. Either
              the guard is watching no backends or its scrape loop is not running. Requests are being
              admitted and nothing else will say so.

    # Recording rules, and the first in this file: everything above is an alert, because everything above had
    # a condition that was unambiguously wrong. These have no condition, on purpose.
    #
    # docs/superpowers/specs/2026-09-21-what-a-violation-would-have-to-mean.md refuses to pick a latency bar,
    # and nothing has declared one for end-to-end duration. So these publish the shape of the distribution and
    # stop there. An alert here would have to invent the threshold that page exists to not invent.
    #
    # WHAT THESE DO NOT MEASURE. docs/02_CONTROL_PLANE_API.md:75 advertises ttftP95Ms and tpotP95Ms on
    # InferenceDeployment. The gateway measures NEITHER. Its only latency series is whole-request duration --
    # server.go:532 says so in as many words -- and the attemptWriter's first-byte latch (proxy.go:579, :590)
    # records no timestamp and closes on the status line, which for a stream is the header rather than the
    # first token. Writing an attainment rule against 1500 ms here would judge a time-to-first-token objective
    # with an end-to-end number. That is the same error this file already records one aisle over, where
    # GatewayUpstreamErrorsReachingClients notes that subtracting a request rate from an attempt rate "cannot
    # be made meaningful by choosing a different number".
    #
    # The buckets are the reason attainment is published at edges rather than at a round figure: the histogram
    # holds 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10, 30, 60 and 120 seconds (metrics.go:75), so a fraction read at
    # an edge is counted, while any other point is interpolated. Reading an invented bar off this would dress
    # interpolation as measurement.
    - name: gateway.latency
      rules:
        # The population is every request the gateway actually handed to a backend, and the two series agree on
        # it by construction: backend_attempts_total is incremented immediately before tryBackends
        # (server.go:517) and the histogram is observed once at the end of that same path (server.go:534).
        # Requests refused earlier -- 401, 403, the limiter's 429, the admission guard's 429 -- are in neither.
        #
        # That matters because 실행/W04-사전등록.md:18 already ruled a refusal to be a treatment rather than a
        # lost observation. A denominator that swept them in would let the gateway improve this number by
        # refusing more traffic.
        - record: gateway:e2e_seconds_under_edge:ratio5m
          expr: |
            sum by (model, le) (rate(gpuaas_gateway_request_duration_seconds_bucket[5m]))
              /
            ignoring(le) group_left sum by (model) (rate(gpuaas_gateway_request_duration_seconds_count[5m]))

        # Published alongside because a ratio over a vanishing denominator is noise, and the reader cannot see
        # the denominator in the ratio itself. A model serving two requests in five minutes has an attainment
        # of 0.5 or 1.0 and neither means anything.
        - record: gateway:backend_attempts:rate5m
          expr: sum by (model) (rate(gpuaas_gateway_backend_attempts_total[5m]))

        # The tail, for orientation only. Quoted with the caveat above: it is whole-request duration, so for a
        # streaming response it is dominated by how many tokens were asked for, not by how quickly serving
        # began. Two models with identical first-token behaviour and different output lengths differ here.
        - record: gateway:e2e_seconds:p99_5m
          expr: |
            histogram_quantile(0.99, sum by (model, le) (rate(gpuaas_gateway_request_duration_seconds_bucket[5m])))

        # First byte, which is the nearer of the two to what docs/02_CONTROL_PLANE_API.md:75 declares.
        #
        # Still not time to first TOKEN: the status line and headers precede the first token on a streaming
        # response, so this is a LOWER bound. One honest statement follows from it and no more -- a request
        # above a given edge had certainly not produced a token by then, while one below it may still have
        # been slow to its first. The gap between byte and token is unmeasured, so the bound cannot be
        # tightened by reasoning about it here.
        #
        # The le="1.5" series is where the declared ttftP95Ms: 1500 falls, and it is an edge of the histogram
        # (metrics.go) rather than an interpolated point, so the fraction there is counted. No rule singles it
        # out and no alert reads it: a figure being readable is not the same as a bar being set, and
        # docs/superpowers/specs/2026-09-21-what-a-violation-would-have-to-mean.md still declines to set one.
        #
        # Errors are in the population on purpose. A 502 or 504 envelope from proxy.go's ErrorHandler is a
        # byte the client received, so it carries a genuine first-byte latency. Excluding it would leave a
        # series that described successes only -- one that improves as the backend gets worse.
        - record: gateway:ttfb_seconds_under_edge:ratio5m
          expr: |
            sum by (model, le) (rate(gpuaas_gateway_time_to_first_byte_seconds_bucket[5m]))
              /
            ignoring(le) group_left sum by (model) (rate(gpuaas_gateway_time_to_first_byte_seconds_count[5m]))

        # The denominator of the ratio above, for the reason backend_attempts:rate5m is published next to the
        # e2e one: a ratio over a handful of requests is noise, and the reader cannot see that from the ratio.
        #
        # It is NOT backend_attempts:rate5m. That counts requests handed to a backend; this counts the subset
        # that produced a byte for the client, and the two differ exactly when a request ends with nothing
        # written -- the state statusRecorder.answered exists to name.
        - record: gateway:ttfb_observations:rate5m
          expr: sum by (model) (rate(gpuaas_gateway_time_to_first_byte_seconds_count[5m]))

        - record: gateway:ttfb_seconds:p99_5m
          expr: |
            histogram_quantile(0.99, sum by (model, le) (rate(gpuaas_gateway_time_to_first_byte_seconds_bucket[5m])))

    - name: gateway.routing
      rules:
        # Fallback working and fallback exhausted look identical in a request-rate graph, because both end in
        # a served response until they do not. The ratio is what separates them: a model whose spare is
        # carrying real traffic is degraded and will fail outright when the spare goes too.
        - alert: GatewayModelDegraded
          expr: |
            sum by (model) (rate(gpuaas_gateway_backend_fallbacks_total[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Model {{ $labels.model }} is being served by a fallback backend"
            description: >-
              Its head backend has been failing for ten minutes and a spare is absorbing the traffic. Attempts
              are capped at two, so this model has no depth left.

        # Upstream errors that fallback did NOT rescue: these reached the client.
        # Requests that ENDED in a 5xx, which is what a client actually experienced.
        #
        # This used to subtract successful fallbacks from upstream errors, and those count different things:
        # upstream_errors_total increments once per failed ATTEMPT, backend_fallbacks_total once per rescued
        # REQUEST. A request whose two attempts both failed contributed 2 and was rescued 0 times, so the
        # stated 0.1 threshold fired at roughly 0.05 failed requests per second. Subtracting a request rate
        # from an attempt rate cannot be made meaningful by choosing a different number.
        #
        # requests_total is stamped once per request with its final status, so a 5xx rate over it is the
        # client-visible failure rate directly, with no arithmetic between mismatched cardinalities.
        - alert: GatewayUpstreamErrorsReachingClients
          expr: |
            sum by (model) (rate(gpuaas_gateway_requests_total{code=~"5.."}[5m])) > 0.1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Model {{ $labels.model }} is failing requests outright"
