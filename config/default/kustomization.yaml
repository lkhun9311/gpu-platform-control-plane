# The install `make deploy` and `make build-installer` render: the operator WITH its admission guards.
#
# It used to be the operator without them, and that made the guards depend on which install a cluster took.
# Argo CD reconciled config/operator-webhook and enforced them; `make deploy` applied this directory and did
# not, so the default install admitted the writes the guards exist to refuse.
#
# The guards are layered over config/default-no-webhook rather than added inside it, because that overlay sets
# a namePrefix and the webhook manifests spell their names out in full. Inside it the prefix would reach them
# twice, the Service would fall outside the Certificate's dnsNames, and with failurePolicy Fail every governed
# write would be refused. TestBothDeploymentPathsRenderTheSameGuards holds this layer to the GitOps one.
#
# cert-manager is a hard dependency: install it first. A cluster that cannot run it applies
# config/default-no-webhook, which is the same operator with admission validation off.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../default-no-webhook
components:
  - ../webhook-component
