---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: inferencedeployments.platform.lkhun9311.github.io
spec:
  group: platform.lkhun9311.github.io
  names:
    kind: InferenceDeployment
    listKind: InferenceDeploymentList
    plural: inferencedeployments
    singular: inferencedeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.model.name
      name: Model
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: InferenceDeployment is the Schema for the inferencedeployments
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of InferenceDeployment
            properties:
              admission:
                description: |-
                  admission selects how the gateway admits requests to this deployment.
                  Absent leaves the gateway's own process-wide mode in charge.
                properties:
                  maxHold:
                    description: |-
                      maxHold is how long a standard request may wait for its turn before it is refused with 429.
                      It has no default: zero would refuse every request that ever had to wait.
                    type: string
                  mode:
                    description: |-
                      mode is Off or HoldCap.
                      HoldCap pairs the gateway's serial-prefill admission with the engine's --long-prefill-token-threshold=384.
                      It was measured on one A10G, one engine version, one model (Qwen2.5-3B-Instruct) and one streaming load, in three registered blocks, against no admission.
                      There its premium-tier p99 time to first token was about 0.30 of no admission.
                      A fixed spacing tuned for that load tied with it within the registered 15%, so HoldCap offers protection that needs no tuning, not the lowest tail and not an SLO.
                      It raises standard-tier latency, refuses a standard request held longer than maxHold, and refuses standard requests that do not stream or ask for other than one choice.
                    enum:
                    - "Off"
                    - HoldCap
                    type: string
                required:
                - mode
                type: object
                x-kubernetes-validations:
                - message: admission.maxHold must lie between 1s and 25s, the longest
                    hold measured
                  rule: '!has(self.maxHold) || (duration(self.maxHold) >= duration(''1s'')
                    && duration(self.maxHold) <= duration(''25s''))'
              engine:
                description: |-
                  engine has the controller render an engine itself instead of the generic serving container.
                  Absent keeps the generic container, unchanged.
                properties:
                  vllm:
                    description: vllm renders the pinned vLLM profile.
                    properties:
                      modelRevision:
                        description: modelRevision pins the model and tokenizer to
                          a Hub commit, as the admission sessions' engine validator
                          required.
                        pattern: ^[0-9a-f]{40}$
                        type: string
                      profile:
                        description: profile is the engine configuration measured
                          on one A10G with Qwen2.5-3B-Instruct; it is the only one
                          offered.
                        enum:
                        - v0.27.1-a10g
                        type: string
                    required:
                    - modelRevision
                    - profile
                    type: object
                required:
                - vllm
                type: object
              gpuClass:
                description: |-
                  gpuClass is the illustrative GPU class (e.g. "l40s").

                  Locally this is backed by simulated capacity (see the dev runbook).
                type: string
              gpuCount:
                description: |-
                  gpuCount is the number of GPUs (nvidia.com/gpu) per replica.

                  Locally this is backed by simulated capacity, not real hardware.
                format: int32
                minimum: 0
                type: integer
              image:
                description: image is the serving runtime container image (e.g. "vllm/vllm-openai:v0.6.0").
                type: string
              model:
                description: model is the model to serve.
                properties:
                  name:
                    description: name is the logical model name.
                    type: string
                  storageUri:
                    description: storageUri is where the model weights live (e.g.
                      "s3://bucket/model", "pvc://claim/path").
                    type: string
                required:
                - name
                - storageUri
                type: object
              port:
                default: 8080
                description: port is the serving container port.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              replicas:
                description: |-
                  replicas is the fixed number of serving replicas.

                  Autoscaling lands in M4.
                format: int32
                minimum: 0
                type: integer
            required:
            - gpuCount
            - image
            - model
            - replicas
            type: object
            x-kubernetes-validations:
            - message: 'admission.mode HoldCap requires spec.engine: the cap is guaranteed
                only on an engine this controller renders'
              rule: '!has(self.admission) || self.admission.mode != ''HoldCap'' ||
                has(self.engine)'
            - message: admission.maxHold is set exactly when admission.mode is HoldCap
              rule: '!has(self.admission) || has(self.admission.maxHold) == (self.admission.mode
                == ''HoldCap'')'
            - message: 'admission.mode HoldCap requires replicas at most 1: serial-prefill
                keys on the Service, so two engines behind it would be serialized
                as one'
              rule: '!has(self.admission) || self.admission.mode != ''HoldCap'' ||
                self.replicas <= 1'
            - message: 'spec.engine requires gpuCount 1: its only profile is one engine
                on one A10G'
              rule: '!has(self.engine) || self.gpuCount == 1'
            - message: spec.engine requires model.storageUri of the form hf://<org>/<repo>
              rule: '!has(self.engine) || self.model.storageUri.matches(''^hf://[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$'')'
            - message: spec.engine requires spec.image pinned to the vLLM v0.27.1
                digest the profile was measured on, from any registry
              rule: '!has(self.engine) || self.image.endsWith(''@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967'')'
          status:
            description: status defines the observed state of InferenceDeployment
            properties:
              admission:
                description: admission is the admission in force for this deployment;
                  absent when the spec asks for none.
                properties:
                  mode:
                    description: mode is HoldCap only once a rollout of an engine
                      rendered with the cap has completed; otherwise Off.
                    enum:
                    - "Off"
                    - HoldCap
                    type: string
                  observedGeneration:
                    description: observedGeneration is the generation this mode was
                      decided for; the gateway trusts it only when it is current.
                    format: int64
                    type: integer
                required:
                - mode
                - observedGeneration
                type: object
              conditions:
                description: |-
                  conditions represent the current state of the InferenceDeployment resource.

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastTransitionTime:
                description: lastTransitionTime is the time the phase last changed.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: phase is the high-level serving state.
                enum:
                - Pending
                - Progressing
                - Ready
                - Degraded
                type: string
              readyReplicas:
                description: readyReplicas is the observed number of ready serving
                  replicas (populated in M4).
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
