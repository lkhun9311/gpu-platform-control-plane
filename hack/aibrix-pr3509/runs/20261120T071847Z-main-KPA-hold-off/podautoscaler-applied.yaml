# The #3439 shape on a plain Deployment: a per-pod KV-cache metric and an external queue-length metric.
# At 4 ready pods kv 0.25 against 0.5 asks for 2, and a queue of 200 against 50 asks for 4, so the queue holds 4.
# maxReplicas is 6 so that a scale-up from the healthy source can be seen to stop at the bound.
# The cooldown is 0s, the arm in which the scale-down of #3439 comes on the first reconcile.
# hack/aibrix-pr3509.sh replaces KPA and adds the hold annotation in the "on" runs.
apiVersion: autoscaling.aibrix.ai/v1alpha1
kind: PodAutoscaler
metadata:
  name: chat
  namespace: pr3509
  annotations:
    autoscaling.aibrix.ai/scale-down-cooldown-window: 0s
spec:
  scalingStrategy: KPA
  minReplicas: 1
  maxReplicas: 6
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat
  metricsSources:
  - metricSourceType: pod
    protocolType: http
    port: "8080"
    path: metrics
    targetMetric: kv_cache_usage_perc
    targetValue: "0.5"
  - metricSourceType: external
    protocolType: http
    endpoint: queue-metrics.pr3509.svc.cluster.local:8000
    path: metrics
    targetMetric: vllm:num_requests_waiting
    targetValue: "50"
