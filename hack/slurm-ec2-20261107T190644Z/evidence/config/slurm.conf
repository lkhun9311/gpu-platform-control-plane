# The Slurm on EC2 session's cluster (docs/superpowers/specs/2026-11-07-slurm-ec2-session-design.md).
# head serves this file to both workers (configless); hack/slurm-ec2/instance.sh appends one NodeName line per worker
# from its own slurmd -C and the partition after them.
ClusterName=ec2lab
SlurmctldHost=head
SlurmctldParameters=enable_configless
SlurmUser=slurm
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
MpiDefault=none

# The confinement under test: every job and step in its own cgroup v2 subtree, limited to its CPUs, memory and devices.
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
JobAcctGatherType=jobacct_gather/cgroup
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
GresTypes=gpu

SchedulerType=sched/backfill
SlurmctldTimeout=60
SlurmdTimeout=60
KillWait=10
MinJobAge=3600
ReturnToService=1
JobRequeue=1

# The lab's GPU fault check, unchanged, on every node state, every 5 s.
HealthCheckProgram=/etc/slurm/gpuhc-ec2.sh
HealthCheckInterval=5
HealthCheckNodeState=ANY

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=head
AccountingStorageTRES=gres/gpu
AccountingStorageEnforce=associations,limits,qos
JobCompType=jobcomp/none
PriorityType=priority/multifactor
NodeName=gpu1 CPUs=4 Boards=1 SocketsPerBoard=1 CoresPerSocket=2 ThreadsPerCore=2 RealMemory=14759 NodeAddr=gpu1 Gres=gpu:1 State=UNKNOWN
NodeName=gpu2 CPUs=4 Boards=1 SocketsPerBoard=1 CoresPerSocket=2 ThreadsPerCore=2 RealMemory=14759 NodeAddr=gpu2 Gres=gpu:1 State=UNKNOWN
PartitionName=gpu Nodes=gpu[1-2] Default=YES MaxTime=60 State=UP
