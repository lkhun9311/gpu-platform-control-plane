# The #2881 setup in hybrid mode: flow control gates on a concurrency-detector, and the same detector filters
# endpoints with failOpen: false, so a request it releases can still leave with rejected-no-endpoints.
# The tokenizer and addEstimatedOutputTokens give each request a token cost: prompt tokens plus its max_tokens.
# The loads average about 256 tokens a request, so 1024 tokens and 4 requests are about the same budget per endpoint.
# The detector is listed as a filter explicitly; the loader would inject it anyway (pkg/epp/config/loader/defaults.go).
apiVersion: llm-d.ai/v1
kind: EndpointPickerConfig
featureGates:
- flowControl
plugins:
- type: token-producer
  parameters:
    modelName: TinyLlama/TinyLlama-1.1B-Chat-v1.0
    vllm:
      url: http://vllm-render:8082
- type: inflight-load-producer
  parameters:
    addEstimatedOutputTokens: true
- name: conc
  type: concurrency-detector
  parameters:
    concurrencyMode: hybrid
    maxConcurrency: 4
    maxTokenConcurrency: 1024
    headroom: 0
    failOpen: false
- type: decode-filter
- type: active-request-scorer
- type: max-score-picker
- type: single-profile-handler
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: decode-filter
  - pluginRef: conc
  - pluginRef: active-request-scorer
  - pluginRef: max-score-picker
flowControl:
  maxRequests: "1k"
  defaultRequestTTL: "60s"
  saturationDetector:
    pluginRef: conc
