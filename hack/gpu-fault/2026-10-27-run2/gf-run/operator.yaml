apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: gpu-platform-control-plane
    control-plane: controller-manager
  name: gpu-platform-control-plane-controller-manager
  namespace: gpu-platform-control-plane-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-platform-control-plane
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: gpu-platform-control-plane
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        image: 007635145730.dkr.ecr.ap-northeast-2.amazonaws.com/gpu-platform-operator@sha256:be59a44c952539c662edb16cc4cf751fe044d101b912036e95b3c0f1d506da03
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: gpu-platform-control-plane-controller-manager
      terminationGracePeriodSeconds: 10
      volumes: []
