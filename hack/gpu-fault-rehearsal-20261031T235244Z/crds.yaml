                description: |-
                  engine has the controller render an engine itself instead of the generic serving container.
                  Absent keeps the generic container, unchanged.
                properties:
                  vllm:
                    description: vllm renders the pinned vLLM profile.
                    properties:
                      modelRevision:
                        description: modelRevision pins the model and tokenizer to
                          a Hub commit, as the admission sessions' engine validator
                          required.
                        pattern: ^[0-9a-f]{40}$
                        type: string
                      profile:
                        description: |-
                          profile is the engine configuration measured on one A10G with Qwen2.5-3B-Instruct.
                          v0.27.1-a10g-prefix-cache is the same configuration with prefix caching on, for the prefix-aware routing study.
                        enum:
                        - v0.27.1-a10g
                        - v0.27.1-a10g-prefix-cache
                        type: string
                    required:
                    - modelRevision
                    - profile
                    type: object
                required:
                - vllm
                type: object
              gpuClass:
                description: |-
                  gpuClass is the illustrative GPU class (e.g. "l40s").

                  Locally this is backed by simulated capacity (see the dev runbook).
                type: string
              gpuCount:
                description: |-
                  gpuCount is the number of GPUs (nvidia.com/gpu) per replica.

                  Locally this is backed by simulated capacity, not real hardware.
                format: int32
                minimum: 0
                type: integer
              image:
                description: image is the serving runtime container image (e.g. "vllm/vllm-openai:v0.6.0").
                type: string
              model:
                description: model is the model to serve.
                properties:
                  name:
                    description: name is the logical model name.
                    type: string
                  storageUri:
                    description: storageUri is where the model weights live (e.g.
                      "s3://bucket/model", "pvc://claim/path").
                    type: string
                required:
                - name
                - storageUri
                type: object
              port:
                default: 8080
                description: port is the serving container port.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              replicas:
                description: |-
                  replicas is the fixed number of serving replicas.

                  Autoscaling lands in M4.
                format: int32
                minimum: 0
                type: integer
              routing:
                description: |-
                  routing selects how the gateway spreads this model's requests across the InferenceDeployments serving it.
                  It applies only when every deployment serving the model in the namespace names the same policy and none is HoldCap.
                  Absent keeps the gateway's ordering: the oldest deployment serves and the others are fallback.
                properties:
                  policy:
                    description: |-
                      policy is RoundRobin, LeastQueue or PrefixAffinity.
                      LeastQueue picks the deployment with the fewest requests the gateway has outstanding on it.
                      PrefixAffinity picks the deployment the gateway last sent the longest run of this prompt's leading text to, an approximation of the engine's prefix cache, and falls back to LeastQueue when that deployment is busier by more than the matched prefix would save.
                      None of them was measured before docs/superpowers/specs/2026-10-27-prefix-aware-routing-design.md registered a study of all three.
                    enum:
                    - RoundRobin
                    - LeastQueue
                    - PrefixAffinity
                    type: string
                required:
                - policy
                type: object
            required:
