                == ''HoldCap'')'
            - message: 'admission.mode HoldCap requires replicas at most 1: serial-prefill
                keys on the Service, so two engines behind it would be serialized
                as one'
              rule: '!has(self.admission) || self.admission.mode != ''HoldCap'' ||
                self.replicas <= 1'
            - message: 'spec.engine requires gpuCount 1: its only profile is one engine
                on one A10G'
              rule: '!has(self.engine) || self.gpuCount == 1'
            - message: spec.engine requires model.storageUri of the form hf://<org>/<repo>
              rule: '!has(self.engine) || self.model.storageUri.matches(''^hf://[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$'')'
            - message: spec.engine requires spec.image pinned to the vLLM v0.27.1
                digest the profile was measured on, from any registry
              rule: '!has(self.engine) || self.image.endsWith(''@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967'')'
            - message: 'admission.mode HoldCap requires engine profile v0.27.1-a10g:
                HoldCap was measured with prefix caching off'
              rule: '!has(self.admission) || self.admission.mode != ''HoldCap'' ||
                !has(self.engine) || self.engine.vllm.profile == ''v0.27.1-a10g'''
          status:
            description: status defines the observed state of InferenceDeployment
            properties:
              admission:
                description: admission is the admission in force for this deployment;
                  absent when the spec asks for none.
                properties:
                  mode:
                    description: mode is HoldCap only once a rollout of an engine
                      rendered with the cap has completed; otherwise Off.
                    enum:
                    - "Off"
                    - HoldCap
                    type: string
                  observedGeneration:
                    description: observedGeneration is the generation this mode was
                      decided for; the gateway trusts it only when it is current.
                    format: int64
                    type: integer
                required:
                - mode
                - observedGeneration
                type: object
              conditions:
                description: |-
                  conditions represent the current state of the InferenceDeployment resource.

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
