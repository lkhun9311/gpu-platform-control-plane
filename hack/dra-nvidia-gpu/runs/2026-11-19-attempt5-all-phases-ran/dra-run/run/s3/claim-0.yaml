apiVersion: v1
kind: Namespace
metadata:
  name: s3-shares
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  namespace: s3-shares
  name: mem-0
spec:
  devices:
    requests:
    - name: gpu
      exactly:
        deviceClassName: gpu.nvidia.com
        capacity:
          requests:
            memory: 4Gi
---
apiVersion: v1
kind: Pod
metadata:
  namespace: s3-shares
  name: pod-0
spec:
  restartPolicy: Never
  containers:
  - name: ctr
    image: ubuntu:22.04
    command: ["bash", "-c"]
    args: ["nvidia-smi -L; trap 'exit 0' TERM; sleep 9999 & wait"]
    resources:
      claims:
      - name: gpu
  resourceClaims:
  - name: gpu
    resourceClaimName: mem-0
  tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"
