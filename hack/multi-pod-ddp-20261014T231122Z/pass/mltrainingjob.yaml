apiVersion: platform.lkhun9311.github.io/v1
kind: MLTrainingJob
metadata:
  name: ddp-pass-231321
  namespace: ddp
spec:
  queue: gpu-ddp
  image: cpu-ddp:torch251
  gpuCount: 1
  distributed:
    worldSize: 2
  command:
    - sh
    - -c
    - |
      export DDP_RUN_ID=ddp-pass-231321 DDP_OUT_DIR=/tmp/evidence OMP_NUM_THREADS=1 DDP_RENDEZVOUS_TIMEOUT_SECONDS=60
      
      exec python /work/train.py
