apiVersion: platform.lkhun9311.github.io/v1
kind: MLTrainingJob
metadata:
  name: ddp-one-rank-fails-231549
  namespace: ddp
spec:
  queue: gpu-ddp
  image: cpu-ddp:torch251
  gpuCount: 1
  distributed:
    worldSize: 2
  command:
    - sh
    - -c
    - |
      export DDP_RUN_ID=ddp-one-rank-fails-231549 DDP_OUT_DIR=/tmp/evidence OMP_NUM_THREADS=1 DDP_RENDEZVOUS_TIMEOUT_SECONDS=60
      export DDP_FAIL_RANK=1 DDP_FAIL_DELAY_SECONDS=10 DDP_HOLD_SECONDS=900
      exec python /work/train.py
