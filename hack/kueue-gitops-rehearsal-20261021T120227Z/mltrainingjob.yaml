apiVersion: platform.lkhun9311.github.io/v1
kind: MLTrainingJob
metadata:
  name: placement
  namespace: train-a
spec:
  queue: gpu-train-a
  image: cpu-ddp:torch251
  gpuCount: 1
  # The static admission policy refuses a GPU job that names no class.
  gpuClass: a10g
  distributed:
    worldSize: 2
  command:
    - sh
    - -c
    - |
      export DDP_RUN_ID=placement DDP_OUT_DIR=/tmp/evidence OMP_NUM_THREADS=1 DDP_RENDEZVOUS_TIMEOUT_SECONDS=120
      exec python /work/train.py
