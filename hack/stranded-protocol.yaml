# The stranded-GPU campaign's frozen protocol, in the form the tool reads.
#
# Registered by docs/superpowers/specs/2026-09-29-stranded-gpu-frozen-protocol.md on 2026-09-29, before any
# comparative run exists. This file is the CANONICAL copy: the tool reads these values rather than restating
# them, so that the page and the code cannot become two statements of one fact that nothing compares.
#
# Changing any value here changes the registered protocol. That is a dated amendment on a spec page, not an
# edit made because a run would otherwise be refused.

version: 1

# The two arms of the first campaign. S-tas is deferred to its own page; a GPU-aware LeastAllocated profile
# remains available in the instrument as a control and is deliberately NOT an arm here.
arms:
  - name: S-default
    installs_scheduler_config: false
    # Qualified behaviourally, because the default plugin set cannot be read here and /configz needs a
    # credential this study has not registered.
    qualification:
      scheduler_args_must_not_contain: ["--config"]
      profile_file_must_be_absent: true
      demand_must_schedule: true
  - name: S-gpu-most
    installs_scheduler_config: true
    qualification:
      check_treatment_must_report_applied: true
      scoring_strategy: MostAllocated
      scoring_resources:
        - name: nvidia.com/gpu
          weight: 1

# Read back from each node's allocatable by name, never trusted from the manifest.
node_layout:
  workers: [2, 1, 1]
  control_plane_devices: 0

# Pinned because this host has more than one Kubernetes version installed, and a version that moved between
# cells would masquerade as the treatment.
images:
  node: kindest/node:v1.31.0
  scheduler: registry.k8s.io/kube-scheduler-amd64:v1.31.0

# Identical in every cell, never reordered per arm. A census is taken after each submission settles.
submissions:
  - id: s1
    request: 1
  - id: s2
    request: 1
  # The discriminating request: it fits only if a two-device node survived the first two submissions.
  - id: s3
    request: 2
    discriminating: true
  - id: s4
    request: 1
  - id: s5
    request: 1
  # Deliberately past saturation, so every cell exercises the shortage-versus-stranding classification.
  - id: s6
    request: 2

# Expected as ledger MEMBERSHIP per step, not as totals at the end: a ledger missing a row balances perfectly.
expected_counts:
  submission_attempts: 6
  accepted_censuses: 6
  membership_at_step_k_must_be: s1..sk

matrix:
  repetitions_per_arm: 3
  cells: 6
  replacements_per_invalid_cell: 1
  max_attempts_total: 12
  publish_every_attempt: true
  reporting_threshold: none

# Performing and judging are separate programs. hack/stranded-cell.sh submits the sequence, waits, reads the
# cluster and writes record.json; it judges nothing. cmd/strandedrun's check-cell and check-campaign decide
# whether an attempt may be counted, so the verdict follows from the recorded bytes alone and can be re-reached
# with no cluster. A performer that could rule its own attempt valid would be judging its own work.
#
# The script reads every value it needs from THIS file -- the sequence, the layout, the images, the timeout,
# the expected census count -- so a change here changes the run and there is nothing in the script to change.
performed_by: hack/stranded-cell.sh
judged_by:
  - check-cell
  - check-campaign

# Both arms render a kind cluster under the same constant name, so only one arm can stand at a time. The arms
# therefore run in sequence -- every repetition of one, then the cluster is replaced, then the other -- and the
# campaign cannot cancel a drift over time. That is a limit of it, registered rather than discovered later.
cluster:
  name: stranded
  one_arm_at_a_time: true
  # In this order. Steps 3 and 4 were both absent from the procedure and both invisible on the treatment
  # cluster, where something had already done them; only an empty cluster showed the difference.
  build_steps:
    - render-cluster writes kind-config.yaml and device-plugins.yaml
    - kind create cluster --config kind-config.yaml
    - kind load docker-image gpu-simulator:latest --name stranded
    - kubectl apply -f device-plugins.yaml, which creates its own namespace
    - wait for capacity by reading allocatable back, never by rollout status
    - stranded-cell.sh cell ARM REP ATTEMPT
  arm_established_by: qualify-arm reading the scheduler's arguments at the start of every cell

barriers:
  settledness_must_be_observed: true
  per_step_timeout_seconds: 120
  retain_per_step:
    - api_response
    - bound_node_name
    - failed_scheduling_events

invalidates_a_cell:
  - unobserved_disposition
  - ledger_membership_mismatch
  - pending_for_a_non_gpu_reason
  - scheduler_restart_during_the_cell
  - scheduler_image_differs_between_cells
  - missing_arm_qualification_evidence
  - advertised_capacity_not_2_1_1_at_start
  - render_directory_not_cleaned_by_the_renderer
  - step_neither_bound_nor_refused_within_timeout
  # The sibling study (docs/superpowers/specs/2026-09-24-node-level-gpu-fragmentation.md, implemented by
  # hack/fragmentation.sh) computes headroom across EVERY namespace and takes its context from an environment
  # variable, so pointing it at this campaign's cluster is one word. These two keep the studies apart.
  - a_submission_of_this_campaign_outside_its_own_cluster
  - the_sibling_studys_fixture_installed_on_the_cells_cluster

# Listed explicitly, because each of these is a result rather than a fault and a protocol that invalidated them
# would be selecting on the outcome.
does_not_invalidate_a_cell:
  - a_tie_between_nodes
  - an_identical_outcome_across_arms_or_repetitions
  - a_stranding_figure_of_zero
  - a_shortage_classification

# Taken by hand before this protocol existed. Evidence that the instrument discriminates; not cells, and no
# figure of theirs enters the comparison.
qualification_evidence_excluded_from_comparison:
  - verify-layout refused 0,0,0 by node name and accepted 2,1,1
  - check-treatment reported applied for MostAllocated and refused the same observation as LeastAllocated
  - take-census reported 0 stranded on a free cluster and 3 after the two-device node was occupied
  - qualify-arm accepted the standing cluster's own readings as S-gpu-most and refused the same evidence as
    S-default, naming the --config it carries; with check-treatment's verdict omitted it refused the treatment
    too, because an absent reading means nobody looked rather than no
  # This one looks like a cell, which is why it is listed. A rehearsal of the whole instrument on a cluster
  # reconfigured repeatedly the same day is not cell 1 of the campaign, and none of its figures enters the
  # comparison. The first cell of the campaign begins from a fresh render-cluster for its arm.
  - stranded-cell.sh ran S-gpu-most rep 1 attempt 1 end to end and check-cell reported it stands with 6
    censuses; the probe held stranded-worker3 and landed on stranded-worker2, s3's two-device request bound to
    the intact stranded-worker, and s4 s5 s6 were refused for want of capacity. A rehearsal, not a result
  # The pair a reader will most want to treat as the result, which is why it is disclosed here. One repetition
  # of each arm is not the registered matrix, and the build procedure changed twice during these runs.
  - S-default rep 1 attempt 1 stood too and the arms diverged -- the reference put s2 on the two-device node,
    so s3's two-device request was refused and census c3 reported stranded_devices=2 with free counts
    1,0,1 -- max(f_i)=1 < q=2 <= sum(f_i)=2, the registered stranding shape observed for the first time
