apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: vllm-shared
    app.kubernetes.io/name: gpu-platform-control-plane
  name: vllm-shared-a
spec:
  ports:
  - name: http
    port: 8000
    targetPort: http
  selector:
    app.kubernetes.io/component: vllm-shared
    platform.lkhun9311.github.io/engine: a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: vllm-shared
    app.kubernetes.io/name: gpu-platform-control-plane
    platform.lkhun9311.github.io/engine: a
  name: vllm-shared-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: vllm-shared
      platform.lkhun9311.github.io/engine: a
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: vllm-shared
        app.kubernetes.io/name: gpu-platform-control-plane
        platform.lkhun9311.github.io/engine: a
    spec:
      containers:
      - args:
        - Qwen/Qwen2.5-3B-Instruct
        - --dtype=half
        - --max-model-len=16384
        - --max-num-seqs=32
        - --gpu-memory-utilization=0.475
        - --kv-cache-memory=3435973836
        - --no-enable-prefix-caching
        - --max-num-batched-tokens=2048
        - --port=8000
        image: vllm/vllm-openai@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
        name: vllm
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
        resources:
          limits:
            nvidia.com/gpu: 1
        startupProbe:
          failureThreshold: 90
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: hf-cache
      hostIPC: true
      nodeSelector:
        platform.lkhun9311.github.io/gpu-sharing: "true"
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Equal
        value: present
      volumes:
      - emptyDir: {}
        name: hf-cache
