apiVersion: platform.lkhun9311.github.io/v1
kind: MLTrainingJob
metadata:
  name: rst-nfs-vis-long-093414
  namespace: rst
spec:
  queue: gpu-rst
  image: distributed-restart:torch251
  gpuCount: 1
  distributed:
    worldSize: 2
    maxRestarts: 1
  stateVolume:
    claimName: shared-long
    mountPath: /shared
  command:
    - sh
    - -c
    - |
      export CKPT_RUN_ID=rst-nfs-vis-long-093414 CKPT_DIR=/shared CKPT_JOB_ID=rst-nfs-vis-long-093414 CKPT_STEPS=20 CKPT_STEP_SLEEP=1 OMP_NUM_THREADS=1 CKPT_FAULT=kill-after-latest:8 CKPT_SHARD_DELAY=1
      python /work/train.py
