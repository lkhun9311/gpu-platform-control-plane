# The serving workload of the AIBrix #3439 replay, and the external metric it depends on.
#
# chat is a gpuaas InferenceDeployment whose replicas an AIBrix PodAutoscaler owns.
# Its pods are llm-d-inference-sim behind simshim, reporting vllm:kv_cache_usage_perc 0.25: the healthy low pod metric.
#
# queue-metrics stands in for the gateway queue-length endpoint of the #3439 report.
# It is the same simulator reporting vllm:num_requests_waiting, which the PodAutoscaler reads as an external source.
# Scaling it to zero is the outage: its Service has no endpoint, so every fetch of the external metric fails.
apiVersion: v1
kind: Namespace
metadata:
  name: lane2
---
apiVersion: platform.lkhun9311.github.io/v1
kind: InferenceDeployment
metadata:
  name: chat
  namespace: lane2
spec:
  model:
    name: chat
    storageUri: s3://lab/chat
  image: SHIM_IMAGE
  gpuCount: 0
  replicas: 4
  replicasOwner: External
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-metrics
  namespace: lane2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue-metrics
  template:
    metadata:
      labels:
        app: queue-metrics
    spec:
      containers:
      - name: sim
        image: SIM_IMAGE
        imagePullPolicy: IfNotPresent
        args: ["--model", "queue", "--port", "8000", "--fake-metrics", '{"waiting-requests":QUEUE_LENGTH}']
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: queue-metrics
  namespace: lane2
spec:
  selector:
    app: queue-metrics
  ports:
  - name: http
    port: 8000
    targetPort: http
