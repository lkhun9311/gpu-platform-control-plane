apiVersion: v1
kind: PersistentVolume
metadata:
  name: restart-shared-train-a
spec:
  capacity:
    storage: 100Gi
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
    - rsize=1048576
    - wsize=1048576
    - hard
    - timeo=600
    - retrans=2
    - noresvport
  nfs:
    server: 10.96.193.41
    path: /
  claimRef:
    namespace: train-a
    name: restart-shared
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restart-shared
  namespace: train-a
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: restart-shared-train-a
  resources:
    requests:
      storage: 100Gi
