apiVersion: v1
kind: PersistentVolume
metadata:
  name: restart-shared-train-a
spec:
  capacity:
    storage: 100Gi
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-03698993337ccdd10
  claimRef:
    namespace: train-a
    name: restart-shared
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restart-shared
  namespace: train-a
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: restart-shared-train-a
  resources:
    requests:
      storage: 100Gi
