kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 32000, hostPort: 32000, listenAddress: "127.0.0.1", protocol: TCP}
      - {containerPort: 32001, hostPort: 32001, listenAddress: "127.0.0.1", protocol: TCP}
      - {containerPort: 32002, hostPort: 32002, listenAddress: "127.0.0.1", protocol: TCP}
