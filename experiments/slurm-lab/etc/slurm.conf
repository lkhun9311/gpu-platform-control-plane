# A three-node lab cluster whose GPUs are declared in gres.conf and do not exist.
ClusterName=lab
SlurmctldHost=slurmctld
SlurmUser=slurm
AuthType=auth/munge
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurm/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# No cgroups inside unprivileged containers, so processes are tracked by parent PID and not confined.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/none
MpiDefault=none

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU
GresTypes=gpu

# Short timeouts so a stopped slurmd is declared DOWN within a minute rather than the default five.
SlurmctldTimeout=30
SlurmdTimeout=20
InactiveLimit=0
KillWait=5
MinJobAge=600
# A node that went DOWN only for not responding returns to service when its slurmd registers again.
ReturnToService=1
# A batch job may be requeued unless it asks not to; each experiment says --requeue or --no-requeue explicitly.
JobRequeue=1

# Accounting is what makes accounts, GrpTRES limits and QoS enforceable at all.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStorageTRES=gres/gpu
AccountingStorageEnforce=associations,limits,qos
JobCompType=jobcomp/none

# QoS weight dominates the priority so the QoS level, not job age, decides who goes first.
PriorityType=priority/multifactor
PriorityWeightQOS=10000
PriorityWeightAge=0
PriorityWeightFairshare=0
PriorityWeightJobSize=0
PriorityWeightPartition=0

# Preemption between QoS levels; each QoS may override this cluster-wide mode with its own PreemptMode.
PreemptType=preempt/qos
PreemptMode=REQUEUE

# The declared CPU and memory are used as written rather than probed, because every node shares one host.
SlurmdParameters=config_overrides
NodeName=c[1-3] CPUs=4 RealMemory=2000 Gres=gpu:2 State=UNKNOWN
PartitionName=gpu Nodes=c[1-3] Default=YES MaxTime=INFINITE State=UP OverSubscribe=NO
