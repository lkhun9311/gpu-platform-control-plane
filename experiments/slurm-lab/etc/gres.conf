# Two GPUs per node, declared, not physical.
# Slurm 24.11 drops a GPU GRES that has no File= ("Ignoring file-less GPU"), so File= names device nodes the entrypoint creates with no driver behind them.
# Slurm schedules, binds and accounts these as GPUs; nothing in a job can reach a real GPU through them.
NodeName=c[1-3] Name=gpu File=/dev/labgpu[0-1]
