# The accounting daemon, backed by the MariaDB container; the password is a local lab value only.
AuthType=auth/munge
DbdHost=slurmdbd
SlurmUser=slurm
LogFile=/var/log/slurm/slurmdbd.log
PidFile=/run/slurm/slurmdbd.pid
StorageType=accounting_storage/mysql
StorageHost=mariadb
StoragePort=3306
StorageUser=slurm
StoragePass=slurmlab
StorageLoc=slurm_acct_db
