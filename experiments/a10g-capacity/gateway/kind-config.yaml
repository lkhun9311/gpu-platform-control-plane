kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: a10g-gw
# One node, as hack/kind-config-gateway-path.yaml argues: the gateway and the stub then share a node in every run,
# so a same-node or cross-node placement cannot be read as gateway time.
# Its own name and host ports, so it never meets another session's `platform` cluster.
nodes:
  - role: control-plane
    extraPortMappings:
      # The gateway's user-traffic port.
      - containerPort: 30280
        hostPort: 30280
        listenAddress: "127.0.0.1"
        protocol: TCP
      # The stub, reached directly: the no-gateway arm.
      - containerPort: 30281
        hostPort: 30281
        listenAddress: "127.0.0.1"
        protocol: TCP
