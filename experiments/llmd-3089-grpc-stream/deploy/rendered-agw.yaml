# Source: llm-d-router-standalone/templates/epp.yaml
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-epp
  namespace: default
  labels:
    app.kubernetes.io/name: epp-epp
    app.kubernetes.io/version: "0.0.0"
    llm-d.ai/igw-mode: llm-d-router-standalone
spec:
  replicas: 1
  strategy:
    # The current recommended EPP deployment pattern is to have a single active replica. This ensures
    # optimal performance of the stateful operations such prefix cache aware scorer.
    # The Recreate strategy the old replica is killed immediately, and allow the new replica(s) to
    # quickly take over. This is particularly important in the high availability set up with leader
    # election, as the rolling update strategy would prevent the old leader being killed because
    # otherwise the maxUnavailable would be 100%.
    #
    # With replicas > 1 this also means the Deployment never reports Available=True,
    # because standby replicas stay NotReady by design. Set router.epp.deploymentStrategy
    # if that blocks your tooling; see "Multi-replica EPP and Helm --wait" in the chart README.
    type: Recreate
  selector:
    matchLabels:
      llm-d-router-standalone: epp-epp
  template:
    metadata:
      labels:
        llm-d-router-standalone: epp-epp
        llm-d.ai/igw-mode: llm-d-router-standalone
      annotations:
        checksum/config: 4760316c682e3ce0ccd5199a1653ce706e9a4deb2f23b292a22712d779ff4c4c
    spec:

      serviceAccountName: epp-epp
      # Conservatively, this timeout should mirror the longest grace period of the pods within the pool
      terminationGracePeriodSeconds: 130
      containers:
        - name: agentgateway-proxy
          image: cr.agentgateway.dev/agentgateway:v1.7.0
          imagePullPolicy: IfNotPresent
          args:
            - "-f"
            - "/config/config.yaml"
          ports:
          - containerPort: 8081
            name: http
          - containerPort: 15020
            name: metrics-15020
          - containerPort: 15021
            name: readiness-15021
          readinessProbe:
            failureThreshold: 1
            httpGet:
              path: /healthz/ready
              port: 15021
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 60
            httpGet:
              path: /healthz/ready
              port: 15021
              scheme: HTTP
            periodSeconds: 1
            successThreshold: 1
            timeoutSeconds: 2
          # Give endpoint removal time to propagate before SIGTERM.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            limits:
              memory: 16Gi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: agentgateway-config-template
              mountPath: /config
              readOnly: true
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v1.0.0
          imagePullPolicy: IfNotPresent
          args:
              - --endpoint-selector
              - "app=grpcstream"
              - --endpoint-target-ports
              - "50051"
              - --zap-encoder
              - "json"
              - --config-file
              - "/config/default-plugins.yaml"
              - --grpc-health-port
              - "9003"
              # Pass additional flags via the router.epp.flags field in values.yaml.
              # Render them as --flag=value so boolean values are parsed correctly.
              - "--secure-serving=false"
              - "--v=2"
              - --tracing=false
          resources:
            
            limits:
              memory: 16Gi
            requests:
              cpu: 100m
              memory: 128Mi
          ports:
            - name: grpc
              containerPort: 9002
            - name: grpc-health
              containerPort: 9003
            - name: metrics
              containerPort: 9090
          livenessProbe:
            grpc:
              port: 9003
              service: liveness
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9003
              service: readiness
            periodSeconds: 2
          # Give endpoint removal time to propagate before SIGTERM.
          # Kubelet performs the delay without a shell in the distroless EPP image.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            
          volumeMounts:
            - name: plugins-config-volume
              mountPath: "/config"
        
      volumes:
        - name: agentgateway-config-template
          configMap:
            name: agentgateway
            items:
              - key: config.yaml
                path: config.yaml
        - name: plugins-config-volume
          configMap:
            name: epp-epp
